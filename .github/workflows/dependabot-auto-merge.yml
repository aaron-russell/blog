name: Dependabot auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    if: >-
      github.repository == 'aaron-russell/blog' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7

      - name: Enable squash auto-merge for minor and patch updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Wait for required checks
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr checks "$PR_URL" --required --watch --fail-fast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Confirm the current commit was merged
        id: merged
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        shell: bash
        run: |
          for attempt in {1..60}; do
            pull_request="$(gh pr view "$PR_URL" --json state,mergedAt,headRefOid)"
            state="$(jq -r '.state' <<< "$pull_request")"
            merged_at="$(jq -r '.mergedAt // empty' <<< "$pull_request")"
            head_sha="$(jq -r '.headRefOid' <<< "$pull_request")"

            if [[ -n "$merged_at" ]]; then
              if [[ "$head_sha" == "$EXPECTED_HEAD_SHA" ]]; then
                echo "merged=true" >> "$GITHUB_OUTPUT"
              else
                echo "The pull request merged a newer commit; its workflow run will handle deployment."
                echo "merged=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi

            if [[ "$state" == "CLOSED" ]]; then
              echo "The pull request closed without merging."
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
          done

          echo "The pull request did not merge within ten minutes." >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Dispatch the production deployment
        if: steps.merged.outputs.merged == 'true'
        run: gh workflow run cloudflare-pages.yml --repo "$GITHUB_REPOSITORY" --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
